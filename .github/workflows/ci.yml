name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 检查逻辑都在 flake.nix 的 checks 中，本地可用同样的 nix build 命令复现。
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 安装器默认为 GitHub 运行器启用 KVM，供 NixOS 虚拟机测试使用。
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      - name: Formatting and static analysis
        run: nix build --no-link --no-write-lock-file --print-build-logs .#checks.x86_64-linux.lint
      - name: Build the vps system and disk script
        run: nix build --no-link --no-write-lock-file --print-build-logs .#checks.x86_64-linux.vps
      - name: Test the proxy switch in a NixOS VM
        run: nix build --no-link --no-write-lock-file --print-build-logs .#checks.x86_64-linux.proxy
      - name: Verify the installer
        run: nix run --no-write-lock-file .#install -- --help
