name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      - name: Check shell and build deployment tools
        run: |
          nix build --no-link --no-write-lock-file \
            .#checks.x86_64-linux.shell \
            .#packages.x86_64-linux.install \
            .#packages.x86_64-linux.rebuild \
            .#packages.x86_64-linux.preflight
      - name: Verify CLI and prepare a CI-only public key when needed
        run: |
          nix run --no-write-lock-file .#install -- --help
          nix run --no-write-lock-file .#rebuild -- --help
          nix run --no-write-lock-file .#preflight -- --help
          mkdir -p work
          keys=$(nix eval --json --no-write-lock-file .#nixosConfigurations.vps.config --apply 'c: c.users.users.${builtins.head c.services.openssh.settings.AllowUsers}.openssh.authorizedKeys.keys')
          if jq -e 'length == 0' <<<"$keys"; then
            if nix run --no-write-lock-file .#preflight -- vps >preflight.log 2>&1; then
              echo "Empty SSH keys must never pass deployment preflight"
              exit 1
            fi
            cat preflight.log
            grep -F '必须配置至少一个完整的 SSH 公钥' preflight.log
            ssh-keygen -q -t ed25519 -N "" -f work/ci-key
            export CI_SSH_PUBKEY="$(cat work/ci-key.pub)"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("vars/default.nix")
          source = path.read_text()
          marker = "sshKeys = [ ];"
          assert marker in source, "Update the CI fixture when changing the empty-key template"
          source = source.replace(marker, "sshKeys = [ " + json.dumps(os.environ["CI_SSH_PUBKEY"]) + " ];", 1)
          path.write_text(source)
          PY
          fi
      - name: Evaluate every flake output and NixOS assertion
        run: nix flake check --no-build --no-write-lock-file --show-trace
      - name: Verify preflight accepts a configured public key
        run: nix run --no-write-lock-file .#preflight -- vps
      - name: Build and smoke-test the Home Manager user environment
        run: |
          nix build --no-write-lock-file --print-build-logs \
            --out-link work/home-activation .#checks.x86_64-linux.home
          work/home-activation/home-path/bin/nvim --headless -u NONE -i NONE '+qa'
          for tool in git fzf bat eza rg fd btop; do
            work/home-activation/home-path/bin/"$tool" --version
          done
      - name: Build the VPS system and disk script, verify system tools
        run: |
          nix build --no-write-lock-file --print-build-logs \
            --out-link work/system .#nixosConfigurations.vps.config.system.build.toplevel
          nix build --no-link --no-write-lock-file --print-build-logs \
            .#nixosConfigurations.vps.config.system.build.diskoScript
          for tool in ssh sudo lsblk ip ping dig lspci lsusb nixos-rebuild; do
            test -x "work/system/sw/bin/$tool"
          done
