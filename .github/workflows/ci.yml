name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      - name: Build the basic installer and verify its help
        run: |
          nix build --no-link --no-write-lock-file .#checks.x86_64-linux.install
          nix run --no-write-lock-file .#install -- --help
      - name: Prepare a CI-only public key for an unconfigured template
        run: |
          mkdir -p work
          if [ "$(nix eval --json --file vars/default.nix sshKeys)" = '[]' ]; then
            ssh-keygen -q -t ed25519 -N "" -f work/ci-key
            export CI_SSH_PUBKEY="$(cat work/ci-key.pub)"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("vars/default.nix")
          source = path.read_text()
          marker = "sshKeys = [ ];"
          assert marker in source, "Update the CI fixture when changing the empty-key template"
          source = source.replace(marker, "sshKeys = [ " + json.dumps(os.environ["CI_SSH_PUBKEY"]) + " ];", 1)
          path.write_text(source)
          PY
          fi
      - name: Evaluate the flake and NixOS assertions
        run: nix flake check --no-build --no-write-lock-file --show-trace
      - name: Build the user environment, system and disk script
        run: |
          nix build --no-link --no-write-lock-file --print-build-logs \
            .#checks.x86_64-linux.home \
            .#nixosConfigurations.vps.config.system.build.toplevel \
            .#nixosConfigurations.vps.config.system.build.diskoScript
      - name: Test mounts and persistence across a VM reboot
        run: |
          sudo chmod a+rw /dev/kvm
          cat > work/persistence-test.nix <<'NIX'
          { lib, myvars, ... }:
          {
            # The test uses a shared 9p store; keep ownership changes in the VPS only.
            disko.tests.extraConfig.nix.settings.build-users-group = lib.mkForce "";
            disko.tests.extraChecks = ''
              machine.wait_for_unit("sshd.service")
              machine.wait_for_unit("home-manager-${myvars.username}.service")
              machine.succeed("findmnt / --types tmpfs")
              machine.succeed("findmnt /nix --types btrfs")
              machine.succeed("findmnt /home --types btrfs")
              machine.succeed("findmnt /boot --types vfat")
              machine.succeed("test $(id -u ${myvars.username}) = 1000")
              machine.succeed("touch /home/persistence-test /nix/var/persistence-test")
              machine.succeed("touch /etc/volatile-test /var/volatile-test /root/volatile-test")
              host_keys = machine.succeed("sha256sum /nix/var/lib/sshd/ssh_host_*_key")
              machine.reboot()
              machine.wait_for_shutdown()
              machine.start()
              machine.wait_for_unit("sshd.service")
              machine.wait_for_unit("home-manager-${myvars.username}.service")
              machine.succeed("findmnt / --types tmpfs")
              machine.succeed("findmnt /nix --types btrfs")
              machine.succeed("findmnt /home --types btrfs")
              machine.succeed("test -f /home/persistence-test && test -f /nix/var/persistence-test")
              machine.succeed("test ! -e /etc/volatile-test && test ! -e /var/volatile-test && test ! -e /root/volatile-test")
              assert machine.succeed("sha256sum /nix/var/lib/sshd/ssh_host_*_key") == host_keys
              machine.succeed("test $(id -u ${myvars.username}) = 1000")
            '';
          }
          NIX
          nix build --impure --no-link --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
            in
              (flake.nixosConfigurations.vps.extendModules {
                modules = [ ./work/persistence-test.nix ];
              }).config.system.build.installTest
          '
