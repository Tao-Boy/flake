name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      # 只需 formatter（nixfmt-tree），不必构建整个开发环境。
      - name: Check formatting
        run: nix fmt --no-write-lock-file -- --ci
      # 求值全部输出，并构建 checks 中的每台机器。
      - name: Check flake and build systems
        run: nix flake check --no-write-lock-file --print-build-logs
